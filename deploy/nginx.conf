# OCI Pool Manager · Modern UI — 统一入口反向代理
# 作用:同时承载 UI(HTTP) + /ws/console(控制台 WebSocket 控制通道)
#       + /ws/aiChat(AI 对话 WebSocket 通道)
#       + /websockify/{port}(VNC TCP→WS 代理,动态端口由 URL 携带)。
# 后端 WebsockifyConfig 在 app 容器内监听 0.0.0.0:{随机高端口},Nginx 与其同网,
# 按 app:{port} 代理即可让浏览器经 Nginx 访问到 websockify。
server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS;带变量的 proxy_pass(http://app:$1)会在请求期解析主机名,必须显式配置 resolver,
    # 否则 nginx 无法把 app 解析到容器 IP,导致 502。127.0.0.11 为默认 Docker DNS。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 根路径直接提供本地 Modern UI SPA 入口（支持静态资源热部署）
    location = / {
        root /usr/share/nginx/html/modern-ui;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 本地静态资源目录（优先本地静态资源，回退到后端）
    location /modern-ui/ {
        alias /usr/share/nginx/html/modern-ui/;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ @backend;
    }

    # 控制台 WebSocket 控制通道(Spring Boot 自带,直接转发到 app 的 9856)
    location /ws/console {
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # AI 对话 WebSocket 通道(/ws/aiChat · 流式聊天)
    location /ws/aiChat {
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # websockify TCP→WebSocket 代理:URL 末尾的 {port} 即 websockify 动态端口
    # 该端口暴露在 app 容器内,同网的 Nginx 可按 app:{port} 到达。
    location ~ ^/websockify/(\d+)$ {
        proxy_pass http://app:$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 其余一切转发到 app(REST API + sa-token 会话)
    location / {
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass http://app:9856;
    }
}
