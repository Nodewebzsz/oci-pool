map $http_accept $ocip_html_nav {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /modern-ui/ {
        alias /usr/share/nginx/modern-ui/;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /ws/ {
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ~ ^/websockify/(\d+)$ {
        if ($arg_token = "") {
            return 401;
        }
        proxy_pass http://app:$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ~ ^/(api|oci-pool|actuator|swagger-ui|v3/api-docs|quartz-monitor|quartz-ui)(/|$) {
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($ocip_html_nav) {
            rewrite ^ /modern-ui/index.html last;
        }
        proxy_pass http://app:9856;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
