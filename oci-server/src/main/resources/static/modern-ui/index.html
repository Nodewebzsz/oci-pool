<style>
  :root {
    color-scheme: light;
    /* Claude design system — warm cream canvas, coral accent */
    --bg-0: #f5f0e8;
    --bg-1: #faf9f5;
    --bg-2: #f5f0e8;
    --bg-3: #efe9de;
    --bg-4: #e8e0d2;
    --border: #e6dfd8;
    --border-strong: #d9d0c1;
    --fg-0: #141413;
    --fg-1: #3d3d3a;
    --fg-2: #6c6a64;
    --fg-3: #8e8b82;

    --accent: #cc785c;
    --accent-2: #cc785c;
    --accent-active: #a9583e;
    --accent-soft: color-mix(in srgb, #cc785c 14%, #faf9f5);
    --accent-fg: #ffffff;

    --brand-bg: color-mix(in srgb, var(--accent) 75%, #141413);
    --brand-border: color-mix(in srgb, var(--accent) 65%, #141413);
    --brand-cloud: #ffffff;
    --brand-resource: #faf9f5;
    --topology-core: #f8fafc;
    --topology-core-border: #e2e8f0;
    --topology-tag: #ffffff;

    --success: #4f9a63;
    --success-soft: color-mix(in srgb, #5db872 16%, #faf9f5);

    --cyan: #3f9b8a;
    --cyan-soft: color-mix(in srgb, #5db8a6 16%, #faf9f5);

    --orange: #c98a3b;
    --orange-soft: color-mix(in srgb, #e8a55a 18%, #faf9f5);

    --danger: #c64545;
    --danger-soft: color-mix(in srgb, #c64545 12%, #faf9f5);

    --info: #6b7f99;
    --info-soft: color-mix(in srgb, #6b7f99 14%, #faf9f5);

    --violet: #8a7396;
    --violet-soft: color-mix(in srgb, #8a7396 14%, #faf9f5);

    --on-dark: #faf9f5;
    --on-dark-soft: #a09d96;
    --on-dark-mute: #7a776f;
    --code-hover: rgba(250,249,245,0.06);
    --surface-code: #181715;
    --surface-code-2: #1f1e1b;

    --shadow-sm: 0 1px 2px rgba(20,20,19,0.06);
    --shadow-md: 0 4px 16px rgba(20,20,19,0.08);

    --radius-sm: 4px;
    --radius: 8px;
    --radius-lg: 12px;

    --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    --font-serif: var(--font-sans);
    --font-mono: 'JetBrains Mono', ui-monospace, 'Sarasa Mono SC', monospace;
    --page-title-size: 20px;
    --page-title-weight: 600;
    --auth-title-size: 26px;
    --auth-title-weight: 600;
    --auth-hero-size: 30px;
    --auth-hero-weight: 600;
    --brand-title-size: 28px;
    --brand-title-weight: 600;
    --brand-title-spacing: 2px;
    --button-radius: var(--radius);
    --button-hover-filter: none;
    --nav-active-bg: var(--bg-3);
    --nav-active-fg: var(--fg-0);
    --nav-service: var(--fg-2);
    --nav-proxy: var(--fg-2);
    --nav-resource: var(--fg-2);
    --nav-system: var(--fg-2);
    --nav-tools: var(--fg-2);
    --nav-developer: var(--fg-2);

    --sidebar-w: 188px;
    --sidebar-w-collapsed: 60px;
    --topbar-h: 52px;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg-0: #181715;
    --bg-1: #1f1e1b;
    --bg-2: #252320;
    --bg-3: #2e2b27;
    --bg-4: #38352f;
    --border: #34312c;
    --border-strong: #46423b;
    --fg-0: #faf9f5;
    --fg-1: #d8d5cd;
    --fg-2: #a09d96;
    --fg-3: #7a776f;
    --accent-soft: color-mix(in srgb, #cc785c 22%, #1f1e1b);
    --brand-bg: #302a25;
    --brand-border: #59473b;
    --brand-cloud: #faf9f5;
    --brand-resource: color-mix(in srgb, var(--accent) 80%, #faf9f5);
    --topology-core: #161b22;
    --topology-core-border: #30363d;
    --topology-tag: #161b22;
    --success: #5db872;
    --success-soft: color-mix(in srgb, #5db872 20%, #1f1e1b);
    --cyan: #5db8a6;
    --cyan-soft: color-mix(in srgb, #5db8a6 20%, #1f1e1b);
    --orange: #e8a55a;
    --orange-soft: color-mix(in srgb, #e8a55a 20%, #1f1e1b);
    --danger: #e0645c;
    --danger-soft: color-mix(in srgb, #e0645c 20%, #1f1e1b);
    --info: #8da2bd;
    --info-soft: color-mix(in srgb, #8da2bd 18%, #1f1e1b);
    --violet: #b09cbd;
    --violet-soft: color-mix(in srgb, #b09cbd 18%, #1f1e1b);
    --surface-code: #12110f;
    --surface-code-2: #181715;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--fg-1);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  html, body { height: 100vh; overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg-0); }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-3); }

  /* 原生 select 下拉 · 部分浏览器(Chrome 116+, Firefox)支持样式化 option */
  select { background: var(--bg-2); color: var(--fg-0); }
  select option, select optgroup {
    background: var(--bg-1);
    color: var(--fg-0);
  }
  select option:checked { background: var(--accent-soft); color: var(--accent); }
  select optgroup {
    font-weight: 600;
    color: var(--fg-2);
    font-style: normal;
  }

  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):focus,
  textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .ui-display, .ui-display * { font-family: var(--font-serif); }

  [data-lucide] { width: 15px; height: 15px; stroke-width: 1.75; }

  /* Hide browser-native password reveal — we render our own eye icon */
  /* Edge / IE */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear { display: none !important; width: 0; height: 0; }
  /* Chrome / Safari auto-fill affordance */
  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-strong-password-auto-fill-button,
  input[type="password"]::-webkit-caps-lock-indicator {
    visibility: hidden !important;
    pointer-events: none !important;
    position: absolute !important;
    right: 0;
    width: 0 !important;
    height: 0 !important;
  }
  /* Firefox reveal button */
  input[type="password"]::-moz-reveal { display: none !important; }

  /* 侧边栏菜单 hover 用纯 CSS,避免直接改 DOM 后 React 重渲染无法清理残留灰底 */
  .sidebar-section-hoverable:hover { background: var(--bg-2) !important; }
  .proxy-pool-row:hover > td { background: var(--bg-2); }
  .proxy-pool-actions button:hover:not(:disabled) { background: var(--bg-3, var(--bg-2)) !important; color: var(--hover-color) !important; }
  .proxy-pool-actions button:disabled { opacity: .45; cursor: default !important; }
  .sidebar-item:not(.sidebar-item-active):hover { background: var(--bg-2) !important; }
  .sidebar-item:focus-visible { background: var(--bg-2); outline: none; }
  .auth-recovery-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .auth-recovery-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .sidebar-item-active { background: var(--nav-active-bg) !important; }
  .sidebar { z-index: 30; }
  .tablet-sidebar-backdrop {
    position: fixed;
    inset: 0;
    z-index: 24;
    padding: 0;
    border: 0;
    background: rgba(20, 20, 19, 0.45);
    backdrop-filter: blur(2px);
    cursor: default;
    animation: fade-in 160ms ease both;
  }

  /* 系统监控页:桌面保持高密度,平板按可用宽度重排完整信息。 */
  .monitor-page { width: 100%; min-width: 0; padding-bottom: 16px; }
  .monitor-kpi-grid,
  .monitor-resource-grid,
  .monitor-bottom-grid {
    display: grid;
    gap: 14px;
    min-width: 0;
  }
  .monitor-kpi-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .monitor-resource-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-bottom: 14px;
  }
  .monitor-bottom-grid {
    grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);
  }
  .monitor-kpi-grid > *,
  .monitor-resource-grid > *,
  .monitor-bottom-grid > * {
    min-width: 0;
  }
  .monitor-resource-card { overflow: hidden; }
  .monitor-resource-card > div:first-child > div,
  .monitor-resource-card > div:first-child > div > div { min-width: 0; }
  .monitor-resource-card > div:first-child > div > div:last-child {
    overflow-wrap: anywhere;
  }
  .monitor-gauge > div {
    width: clamp(144px, 13vw, 180px) !important;
    height: auto !important;
    aspect-ratio: 1;
  }
  .monitor-gauge > div > svg,
  .monitor-gauge > div > div {
    width: 100% !important;
    height: 100% !important;
  }
  .monitor-activity-row > div { overflow-wrap: anywhere; }
  .monitor-activity-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 152px;
    padding: 24px 20px;
    text-align: center;
    font-size: 12px;
    color: var(--fg-3);
    letter-spacing: 0.02em;
  }
  /* 服务商配置页:3 卡网格在窄屏降列,避免提示文案被挤成两行。 */
  .provider-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 1023px) {
    .provider-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 767px) {
    .provider-grid { grid-template-columns: minmax(0, 1fr); }
  }

  @media (min-width: 1024px) and (max-width: 1199px) {
    .monitor-kpi-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .monitor-resource-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .monitor-bottom-grid {
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, 1fr);
    }
    .monitor-gauge > div {
      width: clamp(156px, 20vw, 180px) !important;
    }
  }

  @media (min-width: 768px) and (max-width: 1023px) {
    .monitor-kpi-grid,
    .monitor-resource-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .monitor-bottom-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    .monitor-header > div {
      align-items: flex-start !important;
      flex-wrap: wrap;
      row-gap: 10px;
    }
    .monitor-header > div > div:last-child {
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .monitor-gauge > div {
      width: clamp(148px, 24vw, 180px) !important;
    }
  }

  @media (min-width: 768px) and (max-width: 1199px) {
    .tablet-sidebar-slot {
      width: var(--sidebar-w-collapsed);
      flex: 0 0 var(--sidebar-w-collapsed);
    }
    .sidebar--tablet-overlay {
      position: fixed !important;
      left: 0;
      top: 0;
      width: var(--sidebar-w) !important;
      box-shadow: 8px 0 24px rgba(20, 20, 19, 0.16);
    }
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes button-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes slide-in-right {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page-anim { animation: page-in 220ms cubic-bezier(0.4, 0, 0.2, 1) both; }
</style>
