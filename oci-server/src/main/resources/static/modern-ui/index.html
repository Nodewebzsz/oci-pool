<style>
  :root {
    /* 通知浏览器整个页面为深色调 · 让原生表单控件(select 下拉、date/time picker 等)使用深色渲染 */
    color-scheme: dark;
    /* Dark default — cool slate */
    --bg-0: oklch(0.14 0.010 240);
    --bg-1: oklch(0.18 0.012 240);
    --bg-2: oklch(0.22 0.014 240);
    --bg-3: oklch(0.26 0.014 240);
    --bg-4: oklch(0.30 0.014 240);
    --border: oklch(0.28 0.014 240);
    --border-strong: oklch(0.36 0.016 240);
    --fg-0: oklch(0.98 0.005 240);
    --fg-1: oklch(0.86 0.008 240);
    --fg-2: oklch(0.66 0.010 240);
    --fg-3: oklch(0.50 0.012 240);

    /* Accents — vitality green primary, cyan/orange/red semantic */
    --accent: oklch(0.72 0.16 155);          /* success/primary — green */
    --accent-2: oklch(0.68 0.13 155);
    --accent-soft: oklch(0.30 0.10 155);
    --accent-fg: oklch(0.14 0.02 155);

    --cyan: oklch(0.70 0.13 200);
    --cyan-soft: oklch(0.30 0.09 200);

    --orange: oklch(0.72 0.16 55);
    --orange-soft: oklch(0.30 0.10 55);

    --danger: oklch(0.66 0.19 25);
    --danger-soft: oklch(0.30 0.11 25);

    --info: oklch(0.68 0.13 260);
    --info-soft: oklch(0.30 0.10 260);

    --violet: oklch(0.70 0.15 305);
    --violet-soft: oklch(0.30 0.11 305);

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.4);

    --radius-sm: 5px;
    --radius: 8px;
    --radius-lg: 12px;

    --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'Sarasa Mono SC', monospace;

    --sidebar-w: 188px;
    --sidebar-w-collapsed: 60px;
    --topbar-h: 52px;
  }

  [data-theme="light"] {
    color-scheme: light;
    --bg-0: oklch(0.985 0.004 240);
    --bg-1: oklch(1 0 0);
    --bg-2: oklch(0.965 0.005 240);
    --bg-3: oklch(0.94 0.007 240);
    --bg-4: oklch(0.90 0.008 240);
    --border: oklch(0.90 0.008 240);
    --border-strong: oklch(0.82 0.010 240);
    --fg-0: oklch(0.18 0.014 240);
    --fg-1: oklch(0.32 0.014 240);
    --fg-2: oklch(0.50 0.012 240);
    --fg-3: oklch(0.62 0.010 240);
    --accent-soft: oklch(0.93 0.06 155);
    --cyan-soft: oklch(0.93 0.06 200);
    --orange-soft: oklch(0.94 0.07 55);
    --danger-soft: oklch(0.94 0.06 25);
    --info-soft: oklch(0.94 0.06 260);
    --violet-soft: oklch(0.94 0.07 305);
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
    --shadow-md: 0 4px 14px rgba(15,23,42,0.08);
    --accent-fg: white;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--fg-1);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  html, body { height: 100vh; overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg-0); }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-3); }

  /* 原生 select 下拉 · 部分浏览器(Chrome 116+, Firefox)支持样式化 option */
  select { background: var(--bg-2); color: var(--fg-0); }
  select option, select optgroup {
    background: var(--bg-1);
    color: var(--fg-0);
  }
  select option:checked { background: var(--accent-soft); color: var(--accent); }
  select optgroup {
    font-weight: 600;
    color: var(--fg-2);
    font-style: normal;
  }

  [data-lucide] { width: 15px; height: 15px; stroke-width: 1.75; }

  /* Hide browser-native password reveal — we render our own eye icon */
  /* Edge / IE */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear { display: none !important; width: 0; height: 0; }
  /* Chrome / Safari auto-fill affordance */
  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-strong-password-auto-fill-button,
  input[type="password"]::-webkit-caps-lock-indicator {
    visibility: hidden !important;
    pointer-events: none !important;
    position: absolute !important;
    right: 0;
    width: 0 !important;
    height: 0 !important;
  }
  /* Firefox reveal button */
  input[type="password"]::-moz-reveal { display: none !important; }

  /* 侧边栏菜单 hover 用纯 CSS,避免直接改 DOM 后 React 重渲染无法清理残留灰底 */
  .sidebar-section-hoverable:hover { background: var(--bg-2) !important; }
  .sidebar-item:not(.sidebar-item-active):hover { background: var(--bg-2) !important; }
  .sidebar-item:focus-visible { background: var(--bg-2); outline: none; }
  .sidebar-item-active { background: transparent !important; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes button-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes slide-in-right {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page-anim { animation: page-in 220ms cubic-bezier(0.4, 0, 0.2, 1) both; }
</style>
