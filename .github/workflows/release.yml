name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 1.0.4）'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-server:
    name: Build server JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Package oci-server
        run: mvn -B -pl oci-server -am package -DskipTests
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: oci-server/target/oci-pool-release.jar
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Build DMG
        working-directory: oci-pool-mac
        run: |
          chmod +x build-dmg.sh
          ./build-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: oci-pool-mac/.build/OciPool-*.dmg
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, build-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve release tag
        id: rtag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
            git tag -a "$TAG" -m "OCI-Pool $TAG" || echo "tag $TAG exists"
            git push origin "$TAG" || echo "tag $TAG already pushed"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rtag.outputs.TAG }}"
          PREV=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -v "^$TAG$" | tail -n1)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
          else
            RANGE="$TAG"
          fi
          {
            echo "OCI-Pool $TAG 发布。"
            echo ""
            echo "变更："
            git log --pretty=format:'- %s' "$RANGE" \
              | grep -viE '\[skip ci\]|bump version' \
              | grep -v '^$' || echo "- 初始发布"
            echo ""
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.rtag.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OCI-Pool ${{ steps.rtag.outputs.TAG }}" \
            --notes-file notes.md \
            artifacts/server-jar/oci-pool-release.jar \
            artifacts/mac-dmg/*.dmg
