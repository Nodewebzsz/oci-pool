name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build server JAR
    # 跳过 auto-deploy 自动打的 v* 标签（指向 [skip ci] 提交），避免与 gh release 重复
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Package oci-server
        run: mvn -B -pl oci-server -am package -DskipTests
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: oci-server/target/oci-pool-release.jar
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Build DMG
        working-directory: oci-pool-mac
        run: |
          chmod +x build-dmg.sh
          ./build-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: oci-pool-mac/.build/OciPool-*.dmg
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    needs: [build-server, build-mac]
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OCI-Pool ${{ github.ref_name }}
          body: |
            OCI-Pool ${{ github.ref_name }} 发布。

            - macOS: `OciPool-*.dmg`（未公证，安装见 DMG 内“首次打开.command”）
            - 服务端: `oci-pool-release.jar`

            本仓库是 [doubleDimple/oci-start](https://github.com/doubleDimple/oci-start) 的二次开发分支；想体验原项目最新功能请前往上游。
          files: |
            artifacts/server-jar/oci-pool-release.jar
            artifacts/mac-dmg/*.dmg
