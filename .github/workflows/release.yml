name: 发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 1.0.4）'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-server:
    name: Build server JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Package oci-server
        run: mvn -B -pl oci-server -am package -DskipTests
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: oci-server/target/oci-pool-release.jar
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Build DMG
        working-directory: oci-pool-mac
        run: |
          chmod +x build-dmg.sh
          ./build-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: oci-pool-mac/.build/OciPool-*.dmg
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, build-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve release tag
        id: rtag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
            git tag -a "$TAG" -m "OCI-Pool $TAG" || echo "tag $TAG exists"
            git push origin "$TAG" || echo "tag $TAG already pushed"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rtag.outputs.TAG }}"
          # Resolve release tag 在 checkout 之后才 push 新 tag，必须先 fetch，
          # 否则本机读不到 $TAG，git log 会失败并回退成「初始发布」。
          git fetch origin --tags --force
          PREV=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | grep -v "^$TAG$" \
            | tail -n1)
          if [ -n "$PREV" ]; then
            # 用 HEAD（checkout 到的发布点），不要依赖刚 push 的 $TAG，
            # 否则 tag 尚未在本地时 git log 会失败并回退成「初始发布」。
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## 🚀 版本号 ($TAG)"
            echo ""
            git log --pretty=format:'- %s' "$RANGE" \
              | grep -viE '\[skip ci\]|bump version|chore: bump' \
              | grep -v '^$' || echo "- 常规更新与优化"
          } > notes.md
          cat notes.md

          {
            echo "TG_MSG<<EOF"
            echo "🎉 新版本发布通知"
            echo ""
            echo "项目: $GITHUB_REPOSITORY"
            echo "版本: $TAG"
            echo ""
            echo "更新内容:"
            cat notes.md
            echo ""
            echo "发布链接: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.rtag.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OCI-Pool ${{ steps.rtag.outputs.TAG }}" \
            --notes-file notes.md \
            artifacts/server-jar/oci-pool-release.jar \
            artifacts/mac-dmg/*.dmg
      - name: Send Telegram Release Notification
        if: success()
        continue-on-error: true
        env:
          TG_TO: ${{ secrets.TG_RELEASE_CHANNEL_ID }}
          TG_TOKEN: ${{ secrets.TG_RELEASE_BOT_TOKEN }}
          FALLBACK_TO: ${{ secrets.TELEGRAM_TO }}
          FALLBACK_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          TARGET_TO="${TG_TO:-$FALLBACK_TO}"
          TARGET_TOKEN="${TG_TOKEN:-$FALLBACK_TOKEN}"
          if [ -z "$TARGET_TO" ] || [ -z "$TARGET_TOKEN" ]; then
            echo "⚠️ Telegram to or token is empty, skipping notification."
            exit 0
          fi
          TAG="${{ steps.rtag.outputs.TAG }}"
          NOTES=$(cat notes.md)
          MSG=$(printf "🎉 新版本发布通知\n\n项目: %s\n版本: %s\n\n更新内容:\n%s\n\n发布链接: https://github.com/%s/releases/tag/%s" "$GITHUB_REPOSITORY" "$TAG" "$NOTES" "$GITHUB_REPOSITORY" "$TAG")
          echo "Broadcasting release notification to $TARGET_TO ..."
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TARGET_TOKEN}/sendMessage" \
            -d "chat_id=${TARGET_TO}" \
            --data-urlencode "text=${MSG}")
          echo "Telegram API Response: $RESP"
