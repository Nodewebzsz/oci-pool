name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan secrets (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${PWD}:/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            git \
            --redact \
            --config /path/.gitleaks.toml \
            --report-format sarif \
            --report-path /path/gitleaks.sarif \
            /path

        # 默认不阻断：只上报 SARIF，避免打断现有自动部署流程。
        # 公开仓库稳定后可改为 continue-on-error: false 让扫描失败即失败。
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
