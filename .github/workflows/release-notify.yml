name: Release 发布通知

# 本地 scripts/release_local.sh 发布 Release 后，由此工作流发送 Telegram 通知，
# 机器人 Token 仍只保存在 GitHub Secrets 中。
# 云端兜底 release.yml 使用 GITHUB_TOKEN 发布，不会触发本事件，因此不会重复通知。
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Release Notification
        continue-on-error: true
        env:
          TG_TO: ${{ secrets.TG_RELEASE_CHANNEL_ID }}
          TG_TOKEN: ${{ secrets.TG_RELEASE_BOT_TOKEN }}
          FALLBACK_TO: ${{ secrets.TELEGRAM_TO }}
          FALLBACK_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          TARGET_TO="${TG_TO:-$FALLBACK_TO}"
          TARGET_TOKEN="${TG_TOKEN:-$FALLBACK_TOKEN}"
          if [ -z "$TARGET_TO" ] || [ -z "$TARGET_TOKEN" ]; then
            echo "⚠️ Telegram to or token is empty, skipping notification."
            exit 0
          fi
          MSG=$(printf "🎉 新版本发布通知\n\n项目: %s\n版本: %s\n\n更新内容:\n%s\n\n发布链接: https://github.com/%s/releases/tag/%s" "$REPO" "$TAG" "$NOTES" "$REPO" "$TAG")
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TARGET_TOKEN}/sendMessage" \
            -d "chat_id=${TARGET_TO}" \
            --data-urlencode "text=${MSG}")
          echo "Telegram API Response: $RESP"
